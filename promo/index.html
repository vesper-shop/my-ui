    <meta charset="UTF-8" />

    <style>
      @font-face {
        font-family: "Lora";
        font-weight: 400 700;
        src: url("assets/fonts/lora-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
      }
      @font-face {
        font-family: "Menlo";
        src: local("Menlo");
      }
      :root {
        --paper: #f7f6f2;
        --ink: #2d3038;
        --muted: #606775;
        --accent: #526682;
        --amber: #806127;
        --font-name: "Lora", Georgia, serif;
        --font-text: "PingFang SC", sans-serif;
        --font-mono: "Menlo", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-text);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(circle, #d6dae1 1.5px, transparent 2px);
        background-size: 32px 32px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .name {
        font: 600 220px/1 var(--font-name);
        letter-spacing: -0.04em;
        text-decoration: underline 8px var(--accent);
        text-underline-offset: 0.16em;
      }
      .column {
        position: absolute;
        top: 210px;
        left: 140px;
        width: 620px;
      }
      .kicker {
        display: inline-block;
        padding: 6px 14px;
        border: 3px solid var(--amber);
        font: 600 28px/1.3 var(--font-mono);
        letter-spacing: 0.12em;
        color: var(--amber);
        rotate: -3deg;
      }
      .title {
        margin-top: 28px;
        font: 600 92px/1.1 var(--font-text);
      }
      .sub {
        margin-top: 16px;
        font-size: 34px;
        color: var(--muted);
      }
      .bubble {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 20px;
        border: 3px solid var(--ink);
        border-radius: 18px;
        background: #fff;
        box-shadow: 6px 6px 0 var(--ink);
      }
      .bubble img {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        border-radius: 50%;
        object-fit: cover;
      }
      .bubble b {
        font-size: 28px;
        color: var(--accent);
      }
      .bubble p {
        margin-top: 2px;
        font-size: 30px;
      }
      .frame {
        top: 220px;
        left: 820px;
        width: 960px;
        height: 600px;
        overflow: hidden;
        border: 5px solid var(--accent);
        border-radius: 18px;
        box-shadow:
          16px 18px 0 rgb(0 0 0 / 0.45),
          0 0 60px color-mix(in srgb, var(--accent) 45%, transparent);
        z-index: 3;
      }
      .glare {
        position: absolute;
        top: -20%;
        left: 0;
        width: 22%;
        height: 140%;
        background: linear-gradient(100deg, transparent, rgb(255 255 255 / 0.35), transparent);
        rotate: 12deg;
      }
      .footage {
        top: 220px;
        left: 820px;
        width: 960px;
        height: 600px;
        border-radius: 18px;
        object-fit: cover;
        z-index: 2;
      }
      .mini {
        width: 800px;
        height: 400px;
        inset: auto;
        border: 4px solid var(--ink);
        border-radius: 14px;
        box-shadow: 10px 10px 0 var(--ink);
        object-fit: cover;
        z-index: 2;
      }
      .wipe {
        z-index: 10;
      }
      .frame {

    </style>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from(
        "#v-inter-knot, #f-inter-knot",
        {
          xPercent: 60,
          yPercent: 10,
          rotation: 6,
          scale: 0.7,
          opacity: 0,
          duration: 0.7,
          ease: "back.out(1.4)",
        },
        5,
      );
      tl.to(
        "#v-inter-knot, #f-inter-knot",
        { scale: 1.05, duration: 12.4, ease: "sine.inOut" },
        5.8,
      );
      tl.set("#f-inter-knot .glare", { xPercent: -150 }, 0);
      tl.to("#f-inter-knot .glare", { xPercent: 450, duration: 1.1, ease: "power2.inOut" }, 6.2);
      tl.set("#f-inter-knot .glare", { xPercent: -150 }, 8);
      tl.to("#f-inter-knot .glare", { xPercent: 450, duration: 1.1, ease: "power2.inOut" }, 13.2);
      tl.to(
        "#v-inter-knot, #f-inter-knot",
        { scale: 0.6, opacity: 0, duration: 0.4, ease: "power2.in" },
        18.6,
      );
      tl.fromTo(
        "#w-inter-knot",
        { xPercent: -100 },
        { xPercent: 0, duration: 0.6, ease: "power3.inOut" },
        19.3,
      );
      tl.to("#w-inter-knot", { xPercent: 100, duration: 0.6, ease: "power3.inOut" }, 20.05);
      tl.from(
        "#v-ghostly-grove, #f-ghostly-grove",
        {
          xPercent: 60,
          yPercent: 10,
          rotation: 6,
          scale: 0.7,
          opacity: 0,
          duration: 0.7,
          ease: "back.out(1.4)",
        },
        21,
      );
      tl.to(
        "#v-ghostly-grove, #f-ghostly-grove",
        { scale: 1.05, duration: 12.4, ease: "sine.inOut" },
        21.8,
      );
      tl.set("#f-ghostly-grove .glare", { xPercent: -150 }, 0);
      tl.to(
        "#f-ghostly-grove .glare",
        { xPercent: 450, duration: 1.1, ease: "power2.inOut" },
        22.2,
      );
      tl.set("#f-ghostly-grove .glare", { xPercent: -150 }, 24);
      tl.to(
        "#f-ghostly-grove .glare",
        { xPercent: 450, duration: 1.1, ease: "power2.inOut" },
        29.2,
      );
      tl.to(
        "#v-ghostly-grove, #f-ghostly-grove",
        { scale: 0.6, opacity: 0, duration: 0.4, ease: "power2.in" },
        34.6,
      );
      tl.fromTo(
        "#w-ghostly-grove",
        { xPercent: -100 },
        { xPercent: 0, duration: 0.6, ease: "power3.inOut" },
        35.3,
      );
      tl.to("#w-ghostly-grove", { xPercent: 100, duration: 0.6, ease: "power3.inOut" }, 36.05);
      tl.from(
        "#v-furbobo-gossip, #f-furbobo-gossip",
        {
          xPercent: 60,
          yPercent: 10,
          rotation: 6,
          scale: 0.7,
          opacity: 0,
          duration: 0.7,
          ease: "back.out(1.4)",

      tl.to(

      tl.set("#f-furbobo-gossip .glare", { xPercent: -150 }, 0);
      tl.to(

      tl.to("#w-prts", { xPercent: 100, duration: 0.6, ease: "power3.inOut" }, 68.05);

          rotation: (i) => (i % 2 === 0 ? -8 : 8),
          duration: 0.5,
          ease: "back.out(1.8)",
          stagger: 0.25,

      tl.to(

      );
      tl.to(".mini", { scale: 0.8, opacity: 0, duration: 0.3 }, 75.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
