<!doctype html>
<html lang="zh-CN">
  <body>
    <div
      id="furbobo-gossip"
      data-composition-id="furbobo-gossip"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <style>
        #furbobo-gossip {
          background: #eeebea;
          color: #413835;
        }
        #furbobo-gossip .marquee {
          position: absolute;
          top: 30px;
          left: 0;
          white-space: nowrap;
          font: italic 900 260px/1 var(--font-name);
          color: transparent;
          -webkit-text-stroke: 3px #a85a00;
          opacity: 0.25;
        }
        #furbobo-gossip .side {
          position: absolute;
          top: 250px;
          left: 120px;
          width: 640px;
        }
        #furbobo-gossip .index {
          font: 700 28px/1 var(--font-mono);
          color: #a85a00;
          letter-spacing: 0.2em;
        }
        #furbobo-gossip .zh {
          margin-top: 16px;
          font: 900 120px/1.05 var(--font-text);
        }
        #furbobo-gossip .char {
          display: inline-block;
        }
        #furbobo-gossip .en {
          margin-top: 6px;
          font: 600 34px/1.2 var(--font-name);
          opacity: 0.8;
        }
        #furbobo-gossip .label {
          margin-top: 36px;
          font: 700 28px/1 var(--font-mono);
          color: #a85a00;
        }
        #furbobo-gossip .swatches {
          display: flex;
          gap: 18px;
          margin-top: 14px;
        }
        #furbobo-gossip .swatch {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          width: 110px;
        }
        #furbobo-gossip .dot {
          width: 84px;
          height: 84px;
          border: 4px solid #413835;
          border-radius: 50%;
        }
        #furbobo-gossip .swatch b {
          font-size: 28px;
        }
        #furbobo-gossip .swatch small {
          font: 600 28px/1 var(--font-mono);
          opacity: 0.85;
        }
        #furbobo-gossip .keys {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-top: 14px;
        }
        #furbobo-gossip .key {
          padding: 8px 18px;
          border: 3px solid #413835;
          border-radius: 10px;
          font-size: 30px;
          font-weight: 700;
        }
      </style>
      <div class="marquee" data-layout-ignore>FURBOBO GOSSIP · FURBOBO GOSSIP · FURBOBO GOSSIP</div>
      <div class="side">
        <div class="index">03 / 04</div>
        <h2 class="zh">
          <span class="char">狸</span><span class="char">狸</span><span class="char">通</span
          ><span class="char">信</span>
        </h2>
        <p class="en">Furbobo Gossip</p>
        <p class="label">主题色</p>
        <div class="swatches">
          <div class="swatch">
            <span class="dot" style="background: #f3933e"></span><b>活力橙</b><small>#F3933E</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #f7b350"></span><b>浅橙</b><small>#F7B350</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #eeebea"></span><b>纸面</b><small>#EEEBEA</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #413835"></span><b>墨线</b><small>#413835</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #36a8ea"></span><b>天空蓝</b><small>#36A8EA</small>
          </div>
        </div>
        <p class="label">风格</p>
        <div class="keys">
          <span class="key">纸面点阵</span><span class="key">墨线硬投影</span
          ><span class="key">气泡标签</span>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const BEAT = 0.5;
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#furbobo-gossip .marquee", { x: 0 }, { x: -800, duration: 16, ease: "none" }, 0);
        tl.from(
          "#furbobo-gossip .index",
          { x: -60, opacity: 0, duration: 0.4, ease: "power3.out" },
          0.3,
        );
        tl.from(
          "#furbobo-gossip .char",
          {
            y: 120,
            rotation: (i) => (i % 2 === 0 ? -18 : 18),
            opacity: 0,
            duration: 0.5,
            ease: "back.out(2)",
            stagger: 0.12,
          },
          0.4,
        );
        tl.from("#furbobo-gossip .en", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, 1);
        tl.from(
          "#furbobo-gossip .label",
          { x: -40, opacity: 0, duration: 0.4, ease: "power3.out", stagger: 1.6 },
          1.6,
        );
        tl.from(
          "#furbobo-gossip .dot",
          { scale: 0, duration: 0.4, ease: "back.out(2.4)", stagger: BEAT / 2 },
          1.8,
        );
        tl.from(
          "#furbobo-gossip .swatch b, #furbobo-gossip .swatch small",
          { y: 16, opacity: 0, duration: 0.3, stagger: 0.06 },
          2.1,
        );
        tl.from(
          "#furbobo-gossip .key",
          { scale: 0, rotation: -12, duration: 0.4, ease: "back.out(2.2)", stagger: BEAT },
          3.4,
        );
        tl.to(
          "#furbobo-gossip .dot",
          { scale: 1.15, duration: 0.25, yoyo: true, repeat: 1, stagger: 0.1 },
          8,
        );
        tl.to(
          "#furbobo-gossip .side",
          { x: -80, opacity: 0, duration: 0.35, ease: "power2.in" },
          15.4,
        );
        window.__timelines["furbobo-gossip"] = tl;
      </script>
    </div>
  </body>
</html>
