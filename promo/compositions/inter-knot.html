<!doctype html>
<html lang="zh-CN">
  <body>
    <div
      id="inter-knot"
      data-composition-id="inter-knot"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <style>
        #inter-knot {
          background: #0b0b0b;
          color: #ffffff;
        }
        #inter-knot .marquee {
          position: absolute;
          top: 30px;
          left: 0;
          white-space: nowrap;
          font: italic 900 260px/1 var(--font-name);
          color: transparent;
          -webkit-text-stroke: 3px #f9dc00;
          opacity: 0.25;
        }
        #inter-knot .side {
          position: absolute;
          top: 250px;
          left: 120px;
          width: 640px;
        }
        #inter-knot .index {
          font: 700 28px/1 var(--font-mono);
          color: #f9dc00;
          letter-spacing: 0.2em;
        }
        #inter-knot .zh {
          margin-top: 16px;
          font: 900 120px/1.05 var(--font-text);
        }
        #inter-knot .char {
          display: inline-block;
        }
        #inter-knot .en {
          margin-top: 6px;
          font: 600 34px/1.2 var(--font-name);
          opacity: 0.8;
        }
        #inter-knot .label {
          margin-top: 36px;
          font: 700 28px/1 var(--font-mono);
          color: #f9dc00;
        }
        #inter-knot .swatches {
          display: flex;
          gap: 18px;
          margin-top: 14px;
        }
        #inter-knot .swatch {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          width: 110px;
        }
        #inter-knot .dot {
          width: 84px;
          height: 84px;
          border: 4px solid #ffffff;
          border-radius: 50%;
        }
        #inter-knot .swatch b {
          font-size: 28px;
        }
        #inter-knot .swatch small {
          font: 600 28px/1 var(--font-mono);
          opacity: 0.85;
        }
        #inter-knot .keys {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          margin-top: 14px;
        }
        #inter-knot .key {
          padding: 8px 18px;
          border: 3px solid #ffffff;
          border-radius: 10px;
          font-size: 30px;
          font-weight: 700;
        }
      </style>
      <div class="marquee" data-layout-ignore>INTER-KNOT · INTER-KNOT · INTER-KNOT</div>
      <div class="side">
        <div class="index">01 / 04</div>
        <h2 class="zh"><span class="char">绳</span><span class="char">网</span></h2>
        <p class="en">Inter-Knot</p>
        <p class="label">主题色</p>
        <div class="swatches">
          <div class="swatch">
            <span class="dot" style="background: #000000"></span><b>纯黑底</b><small>#000000</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #383838"></span><b>点阵灰</b><small>#383838</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #f9dc00"></span><b>呼吸黄</b><small>#F9DC00</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #b0d700"></span><b>青柠</b><small>#B0D700</small>
          </div>
          <div class="swatch">
            <span class="dot" style="background: #d7263d"></span><b>关闭红</b><small>#D7263D</small>
          </div>
        </div>
        <p class="label">风格</p>
        <div class="keys">
          <span class="key">黑色点阵条</span><span class="key">黄色底板呼吸</span
          ><span class="key">粗斜体标题</span>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const BEAT = 0.5;
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#inter-knot .marquee", { x: 0 }, { x: -800, duration: 16, ease: "none" }, 0);
        tl.from(
          "#inter-knot .index",
          { x: -60, opacity: 0, duration: 0.4, ease: "power3.out" },
          0.3,
        );
        tl.from(
          "#inter-knot .char",
          {
            y: 120,
            rotation: (i) => (i % 2 === 0 ? -18 : 18),
            opacity: 0,
            duration: 0.5,
            ease: "back.out(2)",
            stagger: 0.12,
          },
          0.4,
        );
        tl.from("#inter-knot .en", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, 1);
        tl.from(
          "#inter-knot .label",
          { x: -40, opacity: 0, duration: 0.4, ease: "power3.out", stagger: 1.6 },
          1.6,
        );
        tl.from(
          "#inter-knot .dot",
          { scale: 0, duration: 0.4, ease: "back.out(2.4)", stagger: BEAT / 2 },
          1.8,
        );
        tl.from(
          "#inter-knot .swatch b, #inter-knot .swatch small",
          { y: 16, opacity: 0, duration: 0.3, stagger: 0.06 },
          2.1,
        );
        tl.from(
          "#inter-knot .key",
          { scale: 0, rotation: -12, duration: 0.4, ease: "back.out(2.2)", stagger: BEAT },
          3.4,
        );
        tl.to(
          "#inter-knot .dot",
          { scale: 1.15, duration: 0.25, yoyo: true, repeat: 1, stagger: 0.1 },
          8,
        );
        tl.to("#inter-knot .side", { x: -80, opacity: 0, duration: 0.35, ease: "power2.in" }, 15.4);
        window.__timelines["inter-knot"] = tl;
      </script>
    </div>
  </body>
</html>
